
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which one bro?</title>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: auto;
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    button {
      padding: 16px 30px;
      background: #fff;
      color: #000;
      border: 2px solid #fff;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #000;
      color: #fff;
      transform: scale(1.05);
    }

    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #000;
    }

    #toolbar {
      height: 52px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 14px;
      background: #111;
    }

    #toolbar button {
      padding: 7px 14px;
      font-size: 14px;
    }

    #siteTitle {
      color: white;
      font-size: 14px;
      flex: 1;
      text-align: left;
    }

    #siteFrame {
      display: block;
      width: 100%;
      height: calc(100% - 52px);
      border: 0;
      background: white;
    }
  </style>
</head>

<body>
  <div id="particles-js"></div>

  <main class="container" id="home">
    <h1>Which one bro?</h1>

    <div class="buttons">
      <button onclick="openSite('https://tungtung.my', 'Tung Tung')">
        Tung Tung
      </button>

      <button onclick="openSite('https://byod.cherrion.top', 'Cherri (no ads)')">
        Cherri (no ads)
      </button>
    </div>
  </main>

  <section id="viewer">
    <div id="toolbar">
      <button onclick="closeSite()">← Back</button>
      <span id="siteTitle"></span>
    </div>

    <iframe
      id="siteFrame"
      title="Selected website"
      allowfullscreen>
    </iframe>
  </section>

  <script>
    function openSite(url, title) {
      document.getElementById('home').style.display = 'none';
      document.getElementById('particles-js').style.display = 'none';
      document.getElementById('viewer').style.display = 'block';
      document.getElementById('siteTitle').textContent = title;
      document.getElementById('siteFrame').src = url;
    }

    function closeSite() {
      document.getElementById('siteFrame').src = 'about:blank';
      document.getElementById('viewer').style.display = 'none';
      document.getElementById('home').style.display = 'flex';
      document.getElementById('particles-js').style.display = 'block';
    }

    particlesJS("particles-js", {
      particles: {
        number: {
          value: 85,
          density: { enable: true, value_area: 900 }
        },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: {
          value: 0.65,
          random: true
        },
        size: {
          value: 3,
          random: true
        },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.25,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.5,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" },
          resize: true
        },
        modes: {
          grab: {
            distance: 160,
            line_linked: { opacity: 0.6 }
          },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
