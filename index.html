
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Which one bro?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 30px;
    }

    .site-button {
      display: block;
      width: min(280px, 85vw);
      margin: 14px auto;
      padding: 15px 22px;
      border: 0;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .site-button:hover {
      transform: scale(1.04);
      background: #ddd;
    }

    #status {
      min-height: 18px;
      color: #aaa;
      font-size: 13px;
    }

    /* Full-screen Petezah viewer */
    #petezah-viewer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      z-index: 9999;
      background: #000;
    }

    #petezah-frame {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      margin: 0;
      padding: 0;
      background: #000;
    }

    /* Close button */
    #close-viewer {
      position: absolute;
      z-index: 10000;
      top: max(10px, env(safe-area-inset-top));
      right: max(10px, env(safe-area-inset-right));
      width: 38px;
      height: 38px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      font-size: 27px;
      line-height: 38px;
      text-align: center;
      cursor: pointer;
      transition: color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    #close-viewer:hover,
    #close-viewer:focus-visible {
      color: #ff3030;
      background: rgba(35, 35, 35, 0.95);
    }

    @media (hover: none) {
      #close-viewer:active {
        color: #ff3030;
      }
    }

    @media (max-width: 480px) {
      .content {
        padding: 18px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .site-button {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="particles-js" aria-hidden="true"></div>

  <main class="content" id="home">
    <h1>Which one bro?</h1>

    <button class="site-button"
      onclick="openNewTab('https://tungtung.my')">
      Tung Tung
    </button>

    <button class="site-button"
      onclick="openNewTab('https://byod.cherrion.top')">
      Cherri (no ads)
    </button>

    <button class="site-button"
      onclick="openPetezah()">
      Petezah
    </button>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <!-- Only Petezah uses this full-page iframe -->
  <section id="petezah-viewer" aria-label="Petezah viewer">
    <iframe
      id="petezah-frame"
      title="Petezah"
      allow="fullscreen; autoplay; clipboard-read; clipboard-write"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <button
      id="close-viewer"
      type="button"
      aria-label="Close Petezah and return to the main page"
      title="Back to main page"
      onclick="closePetezah()">×</button>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <script>
    // Animated background: 89 particles
    if (window.particlesJS) {
      particlesJS("particles-js", {
        particles: {
          number: {
            value: 89,
            density: {
              enable: true,
              value_area: 800
            }
          },
          color: { value: "#ffffff" },
          shape: { type: "circle" },
          opacity: {
            value: 0.5,
            random: false
          },
          size: {
            value: 3,
            random: true
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#ffffff",
            opacity: 0.25,
            width: 1
          },
          move: {
            enable: true,
            speed: 2,
            direction: "none",
            random: false,
            straight: false,
            out_mode: "out",
            bounce: false
          }
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: {
              enable: true,
              mode: "grab"
            },
            onclick: {
              enable: true,
              mode: "push"
            },
            resize: true
          },
          modes: {
            grab: {
              distance: 140,
              line_linked: { opacity: 0.6 }
            },
            push: { particles_nb: 4 }
          }
        },
        retina_detect: true
      });
    }

    const allowedSites = [
      "tungtung.my",
      "byod.cherrion.top",
      "petezahgames.com"
    ];

    function validateUrl(url) {
      try {
        const target = new URL(url);
        target.protocol = "https:";

        if (!allowedSites.includes(target.hostname)) {
          return null;
        }

        return target.href;
      } catch {
        return null;
      }
    }

    // Tung Tung and Cherri open in separate about:blank tabs.
    function openNewTab(url) {
      const safeUrl = validateUrl(url);

      if (!safeUrl) return;

      const newTab = window.open("about:blank", "_blank");

      if (!newTab) {
        document.getElementById("status").textContent =
          "Pop-up blocked. Allow pop-ups and try again.";
        return;
      }

      newTab.document.title = "Dr Frost Maths";

      const favicon = newTab.document.createElement("link");
      favicon.rel = "icon";
      favicon.type = "image/svg+xml";
      favicon.href =
        "https://favicondl.com/api/proxy?url=https%3A%2F%2Fwww.drfrost.org%2Ffavicon.svg";

      newTab.document.head.appendChild(favicon);

      const viewport = newTab.document.createElement("meta");
      viewport.name = "viewport";
      viewport.content =
        "width=device-width, initial-scale=1, viewport-fit=cover";
      newTab.document.head.appendChild(viewport);

      const style = newTab.document.createElement("style");
      style.textContent = `
        html, body {
          width: 100%;
          height: 100%;
          margin: 0;
          padding: 0;
          overflow: hidden;
          background: #000;
        }
        iframe {
          position: fixed;
          inset: 0;
          width: 100%;
          height: 100%;
          border: 0;
          display: block;
        }
      `;
      newTab.document.head.appendChild(style);

      const frame = newTab.document.createElement("iframe");
      frame.title = "Website viewer";
      frame.src = safeUrl;
      newTab.document.body.appendChild(frame);
    }

    // Petezah opens over the main page in the same tab.
    function openPetezah() {
      const safeUrl = validateUrl("https://petezahgames.com");
      if (!safeUrl) return;

      document.getElementById("petezah-viewer").style.display = "block";
      document.getElementById("petezah-frame").src = safeUrl;

      document.getElementById("close-viewer").focus({
        preventScroll: true
      });
    }

    // Hide the viewer and restore the existing main page.
    function closePetezah() {
      document.getElementById("petezah-viewer").style.display = "none";

      // Stop the embedded page after closing it.
      document.getElementById("petezah-frame").src = "about:blank";

      // Return keyboard focus to the Petezah button.
      document.querySelector(
        '.site-button[onclick="openPetezah()"]'
      ).focus({ preventScroll: true });
    }

    // Escape key also closes the viewer on desktop keyboards.
    document.addEventListener("keydown", function(event) {
      if (
        event.key === "Escape" &&
        document.getElementById("petezah-viewer").style.display === "block"
      ) {
        closePetezah();
      }
    });
  </script>
</body>
</html>
