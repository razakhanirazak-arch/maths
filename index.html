
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which one bro?</title>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 4rem);
      margin-bottom: 35px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .buttons button {
      padding: 16px 30px;
      background: #fff;
      color: #000;
      border: 2px solid #fff;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .buttons button:hover {
      background: #000;
      color: #fff;
      transform: scale(1.05);
    }

    /* Full-screen website viewer */
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 10;
      background: #000;
    }

    #siteFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="particles-js"></div>

  <main class="container" id="home">
    <h1>Which one bro?</h1>

    <div class="buttons">
      <button onclick="openSite('https://tungtung.my')">
        Tung Tung
      </button>

      <button onclick="openSite('https://byod.cherrion.top')">
        Cherri (no ads)
      </button>
    </div>
  </main>

  <div id="viewer">
    <iframe id="siteFrame" title="Website"></iframe>
  </div>

  <script>
    function openSite(url) {
      document.getElementById('home').style.display = 'none';
      document.getElementById('particles-js').style.display = 'none';

      const viewer = document.getElementById('viewer');
      const frame = document.getElementById('siteFrame');

      viewer.style.display = 'block';
      frame.src = url;
    }

    particlesJS("particles-js", {
      particles: {
        number: {
          value: 85,
          density: {
            enable: true,
            value_area: 900
          }
        },
        color: { value: "#ffffff" },
        shape: { type: "circle" },
        opacity: {
          value: 0.65,
          random: true
        },
        size: {
          value: 3,
          random: true
        },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.25,
          width: 1
        },
        move: {
          enable: true,
          speed: 1.5,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: { enable: true, mode: "grab" },
          onclick: { enable: true, mode: "push" },
          resize: true
        },
        modes: {
          grab: {
            distance: 160,
            line_linked: { opacity: 0.6 }
          },
          push: { particles_nb: 4 }
        }
      },
      retina_detect: true
    });
  </script>
</body>
</html>
