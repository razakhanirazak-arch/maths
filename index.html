
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#000000">
  <title>Which one bro?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 30px;
    }

    .site-button {
      display: block;
      width: min(280px, 85vw);
      margin: 14px auto;
      padding: 15px 22px;
      border: none;
      border-radius: 10px;
      background: #fff;
      color: #000;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .site-button:hover {
      transform: scale(1.04);
      background: #ddd;
    }

    .site-button:focus-visible {
      outline: 3px solid #888;
      outline-offset: 4px;
    }

    #status {
      min-height: 18px;
      color: #aaa;
      font-size: 13px;
    }

    @media (max-width: 480px) {
      .content {
        padding: 18px;
      }

      h1 {
        margin-bottom: 24px;
      }

      .site-button {
        padding: 16px;
      }
    }
  </style>
</head>

<body>
  <div id="particles-js" aria-hidden="true"></div>

  <main class="content">
    <h1>Which one bro?</h1>

    <button class="site-button"
      onclick="openSite('https://tungtung.my')">
      Tung Tung
    </button>

    <button class="site-button"
      onclick="openSite('https://byod.cherrion.top')">
      Cherri (no ads)
    </button>

    <button class="site-button"
      onclick="openSite('https://petezahgames.com')">
      Petezah
    </button>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>

  <script>
    // PARTICLES: exactly 89
    if (window.particlesJS) {
      particlesJS("particles-js", {
        particles: {
          number: {
            value: 89,
            density: {
              enable: true,
              value_area: 800
            }
          },
          color: {
            value: "#ffffff"
          },
          shape: {
            type: "circle"
          },
          opacity: {
            value: 0.5,
            random: false
          },
          size: {
            value: 3,
            random: true
          },
          line_linked: {
            enable: true,
            distance: 150,
            color: "#ffffff",
            opacity: 0.25,
            width: 1
          },
          move: {
            enable: true,
            speed: 2,
            direction: "none",
            random: false,
            straight: false,
            out_mode: "out",
            bounce: false
          }
        },
        interactivity: {
          detect_on: "canvas",
          events: {
            onhover: {
              enable: true,
              mode: "grab"
            },
            onclick: {
              enable: true,
              mode: "push"
            },
            resize: true
          },
          modes: {
            grab: {
              distance: 140,
              line_linked: {
                opacity: 0.6
              }
            },
            push: {
              particles_nb: 4
            }
          }
        },
        retina_detect: true
      });
    }

    // OPEN A FULL-SCREEN IFRAME IN A NEW ABOUT:BLANK TAB
    function openSite(url) {
      const allowedSites = [
        "tungtung.my",
        "byod.cherrion.top",
        "petezahgames.com"
      ];

      let target;

      try {
        target = new URL(url);
      } catch {
        return;
      }

      if (
        target.protocol !== "https:" ||
        !allowedSites.includes(target.hostname)
      ) {
        return;
      }

      // Open synchronously so browsers are less likely to block the tab.
      const newTab = window.open("about:blank", "_blank");

      if (!newTab) {
        document.getElementById("status").textContent =
          "Pop-up blocked. Allow pop-ups for this site, then try again.";
        return;
      }

      // Set the new tab's document title.
      newTab.document.title = "Dr Frost Maths";

      // Use the requested Dr Frost Maths favicon.
      const favicon = newTab.document.createElement("link");
      favicon.rel = "icon";
      favicon.type = "image/svg+xml";
      favicon.href =
        "https://favicondl.com/api/proxy?url=https%3A%2F%2Fwww.drfrost.org%2Ffavicon.svg";

      newTab.document.head.appendChild(favicon);

      // Add mobile viewport and full-screen page styling.
      const viewport = newTab.document.createElement("meta");
      viewport.name = "viewport";
      viewport.content =
        "width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover";

      newTab.document.head.appendChild(viewport);

      const style = newTab.document.createElement("style");
      style.textContent = `
        *, *::before, *::after {
          box-sizing: border-box;
        }

        html, body {
          width: 100%;
          height: 100%;
          min-height: 100%;
          margin: 0;
          padding: 0;
          border: 0;
          overflow: hidden;
          background: #000;
        }

        iframe {
          position: fixed;
          top: 0;
          left: 0;
          display: block;
          width: 100%;
          height: 100%;
          width: 100vw;
          height: 100vh;
          height: 100dvh;
          border: 0;
          margin: 0;
          padding: 0;
          background: #000;
        }

        @supports (height: 100svh) {
          iframe {
            min-height: 100svh;
          }
        }
      `;

      newTab.document.head.appendChild(style);

      // Create the full-screen iframe.
      const frame = newTab.document.createElement("iframe");
      frame.title = "Website viewer";
      frame.allow = "fullscreen; autoplay; clipboard-read; clipboard-write";
      frame.referrerPolicy = "strict-origin-when-cross-origin";
      frame.src = target.href;

      newTab.document.body.appendChild(frame);
    }
  </script>
</body>
</html>
