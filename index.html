
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Which one bro?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #particles-js {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 30px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .site-button {
      padding: 14px 24px;
      color: #fff;
      background: #171717;
      border: 1px solid #444;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
    }

    .site-button:hover {
      background: #292929;
      border-color: #fff;
      transform: translateY(-3px);
    }

    .site-button:focus-visible {
      outline: 2px solid white;
      outline-offset: 4px;
    }
  </style>
</head>

<body>
  <div id="particles-js"></div>

  <main class="container">
    <h1>Which one bro?</h1>

    <div class="buttons">
      <button class="site-button"
        data-url="https://tungtung.my">
        Tung Tung
      </button>

      <button class="site-button"
        data-url="https://byod.cherrion.top">
        Cherri (no ads)
      </button>

      <button class="site-button"
        data-url="https://azino777-nvsa.sbs/">
        Petezah
      </button>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>

  <script>
    // Animated background with exactly 89 particles.
    particlesJS("particles-js", {
      particles: {
        number: {
          value: 89,
          density: {
            enable: false
          }
        },
        color: {
          value: "#ffffff"
        },
        shape: {
          type: "circle"
        },
        opacity: {
          value: 0.55,
          random: true
        },
        size: {
          value: 3,
          random: true
        },
        line_linked: {
          enable: true,
          distance: 150,
          color: "#ffffff",
          opacity: 0.2,
          width: 1
        },
        move: {
          enable: true,
          speed: 2,
          direction: "none",
          random: false,
          straight: false,
          out_mode: "out"
        }
      },
      interactivity: {
        detect_on: "canvas",
        events: {
          onhover: {
            enable: true,
            mode: "grab"
          },
          onclick: {
            enable: true,
            mode: "push"
          },
          resize: true
        },
        modes: {
          grab: {
            distance: 140,
            line_linked: {
              opacity: 0.5
            }
          },
          push: {
            particles_nb: 4
          }
        }
      },
      retina_detect: true
    });

    const faviconUrl =
      "https://favicondl.com/api/proxy?url=https%3A%2F%2Fwww.drfrost.org%2Ffavicon.svg";

    function openNewTab(url) {
      // Open a blank tab directly from the button click.
      const newTab = window.open("about:blank", "_blank");

      if (!newTab) {
        alert("The new tab was blocked. Allow pop-ups for this page and try again.");
        return;
      }

      const doc = newTab.document;

      doc.open();
      doc.write(`<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dr Frost Maths</title>
  <link rel="icon" type="image/svg+xml" sizes="32x32"
        href="${faviconUrl}">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    src="${url}"
    title="Website"
    allowfullscreen
    referrerpolicy="no-referrer">
  </iframe>
</body>
</html>`);
      doc.close();
    }

    document.querySelectorAll(".site-button").forEach(button => {
      button.addEventListener("click", () => {
        openNewTab(button.dataset.url);
      });
    });
  </script>
</body>
</html>
